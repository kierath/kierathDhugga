<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gazetteer</title>
    <!-- From leafletjs.com -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
    <!-- My stylesheet for map.css -->
    <link rel="stylesheet" href="css/map.css">
    <!-- Bootstrap import -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <!--left side of nav bar-->
            <a class="navbar-brand w-25" href="#">Gazetteer</a>
            <!-- middle of nav bar time -->
            <span id="currentTime" class="justify-content-center"></span>
            <!--right side dropdown select country -->
            <select id="countrySelect" class="form-select w-25">
                <option value="">Select Country</option>
            </select>
        </div>
    </nav>
    <!--POI LOADER-->
    <div id="poiLoader">
        <div class="spinner"></div>
        <p>Loading points of interest and country information...</p>
    </div>

    <!--CAPITAL NAME-->
    <div id="capitalTitleContainer">
        <h3 id="capitalTitle"></h3>
    </div>

    <!--MAP-->
    <div id="map"></div>

    <!--OVERLAY MAP PANEL-->
    <div id="overlayMapPanel">
        <button id="closeOverlayButton" class="closeOverlayButton">&times;</button>
        <div id="loader">
            <div class="spinner"></div>
        </div>

        <!--country summary at top of card overlay-->
        <div class="topOverlay">
            <img id="countryFlag" src="" />
            <h2 id="countryName">Country Name</h2>
            <p id="region"></p>
        </div>

        <!--Details from apis for the country-->
        <div class="infoOverlay">
            <div class="infoRow">
                <strong>Capital:</strong> <span id="capital"></span>
            </div>

            <div class="infoRow">
                <strong>Population:</strong> <span id="population"></span>
            </div>

            <div class="infoRow">
                <strong>Currency:</strong> <span id="currencies"></span>
            </div>

            <div class="infoRow">
                <strong>Weather:</strong> <span id="weather"></span>
            </div>

            <div class="infoRow">
                <strong>Localtime:</strong> <span id="countryTime"></span>
            </div>
            <div class="infoRow">
                <strong>Top 3 Wikipedia links:</strong> <span id="wikiLinks"></span>
            </div>
        </div>
        <!-- Seperate div for the image for country-->
        <div class="countryImageContainer"> <img id="countryImage" src="" alt="" />
            <div class="captionImage">
                <span id="countryImageCaption"></span> - <span id="countryImagePhotographer"></span>
            </div>
        </div>

    </div>

    <!-- From leafletjs.com -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
    <script src="js/map.js"></script>
</body>

</html>
